name: Deploy to AWS

# Publishes the site to S3 + CloudFront on every push to main.
# Auth uses GitHub OIDC -> IAM role (no AWS keys stored in GitHub).
# Setup: docs/DEPLOY-AWS.md. Until the repository variables exist the job is
# skipped, so merging this workflow early is harmless.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Stage public files
        run: |
          # only git-tracked files; repo tooling and docs stay private
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/infra _site/docs _site/README.md _site/.nojekyll
          echo "Files to publish: $(find _site -type f | wc -l)"
          test -f _site/index.html && test -f _site/404.html

      # Static assets: cached at the edge, 1 day in browsers. Not fingerprinted,
      # so the invalidation below makes CloudFront pick up changes immediately.
      - name: Upload assets
        run: |
          aws s3 sync _site "s3://$BUCKET" --delete --no-progress \
            --exclude '*.html' --exclude '*.xml' --exclude '*.txt' --exclude '*.json' --exclude '*.webp' \
            --cache-control 'public, max-age=86400'
          aws s3 sync _site "s3://$BUCKET" --delete --no-progress \
            --exclude '*' --include '*.webp' \
            --content-type 'image/webp' --cache-control 'public, max-age=86400'

      # Documents: always revalidated so new deploys show up at once.
      - name: Upload documents
        run: |
          aws s3 sync _site "s3://$BUCKET" --delete --no-progress \
            --exclude '*' --include '*.html' --include '*.xml' --include '*.txt' --include '*.json' \
            --cache-control 'public, max-age=0, must-revalidate'

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          echo "Invalidation $id created"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Smoke test
        run: |
          for path in / /robots.txt /sitemap.xml /assets/js/main.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rafey.me$path")
            echo "$code $path"; [ "$code" = 200 ] || exit 1
          done
